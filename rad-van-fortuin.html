<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rad van Fortuin</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: wheel left, entry list right; stacks to one column on phones */
:root {
  --bg: #f3f1ec;
  --panel: #ffffff;
  --fg: #1d1b26;
  --muted: #6b6878;
  --line: #dcd8ce;
  --accent: #d6331f;
  --hub: #1d1b26;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Figtree", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15141b; --panel: #1f1e27; --fg: #f1efe8; --muted: #a29fb0;
    --line: #34323f; --accent: #ff5a3d; --hub: #f1efe8; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15141b; --panel: #1f1e27; --fg: #f1efe8; --muted: #a29fb0;
  --line: #34323f; --accent: #ff5a3d; --hub: #f1efe8; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 40px;
}
.wrap { max-width: 1040px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 32px; align-items: start; }
@media (max-width: 760px) { .wrap { grid-template-columns: minmax(0, 1fr); } }
h1 { font-family: var(--display); font-weight: 800; font-size: clamp(30px, 5vw, 44px); letter-spacing: -0.02em; margin: 0 0 4px; text-wrap: balance; }
.sub { color: var(--muted); margin: 0 0 20px; }
.stage { display: flex; flex-direction: column; align-items: center; gap: 20px; }
.wheel-box { position: relative; width: 100%; max-width: 520px; aspect-ratio: 1; }
canvas { width: 100%; height: 100%; display: block; }
.pointer {
  position: absolute; top: -6px; left: 50%; transform: translateX(-50%);
  width: 0; height: 0; border-left: 18px solid transparent; border-right: 18px solid transparent;
  border-top: 34px solid var(--accent); filter: drop-shadow(0 3px 3px rgba(0,0,0,.25)); z-index: 2;
}
.spin {
  font-family: var(--display); font-weight: 800; font-size: 20px; letter-spacing: .04em; text-transform: uppercase;
  background: var(--accent); color: #fff; border: 0; border-radius: 999px; padding: 14px 44px; cursor: pointer;
  box-shadow: 0 4px 0 rgba(0,0,0,.25); transition: transform .1s, box-shadow .1s, opacity .2s;
}
.spin:hover { transform: translateY(-1px); }
.spin:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.25); }
.spin:disabled { opacity: .5; cursor: default; transform: none; }
.spin:focus-visible, textarea:focus-visible, .small:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.result { min-height: 2.6em; text-align: center; font-family: var(--display); font-weight: 600; font-size: 22px; text-wrap: balance; }
.result b { color: var(--accent); font-weight: 800; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
.panel h2 { font-family: var(--display); font-weight: 600; font-size: 18px; margin: 0; }
label { color: var(--muted); font-size: 13px; }
textarea {
  width: 100%; min-height: 260px; resize: vertical; font: inherit; line-height: 1.6;
  background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
}
.row { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.count { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.small { font: inherit; font-size: 13px; font-weight: 600; background: transparent; color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
.small:hover { border-color: var(--muted); }
.history { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.history li { font-size: 13px; border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; }
.history:empty::before { content: "Nog niet gedraaid"; color: var(--muted); font-size: 13px; }
</style>

<div class="wrap">
  <section>
    <h1>Rad van Fortuin</h1>
    <p class="sub">Vul de vakken in, draai, en laat het lot beslissen.</p>
    <div class="stage">
      <div class="wheel-box">
        <div class="pointer" aria-hidden="true"></div>
        <canvas id="wheel" aria-label="Rad van fortuin"></canvas>
      </div>
      <button class="spin" id="spin">Draai!</button>
      <div class="row" style="justify-content:center">
        <button class="small" id="sound" type="button" aria-pressed="true">Geluid: aan</button>
        <button class="small" id="music" type="button" aria-pressed="false">Muziek: uit</button>
      </div>
      <div class="result" id="result" aria-live="polite"></div>
    </div>
  </section>

  <aside class="panel">
    <h2>Vakken</h2>
    <label for="entries">Eén vak per regel. Het rad past zich direct aan.</label>
    <textarea id="entries" spellcheck="false"></textarea>
    <div class="row">
      <span class="count" id="count"></span>
      <button class="small" id="shuffle" type="button">Husselen</button>
    </div>
    <div class="row">
      <h2>Eerdere uitkomsten</h2>
      <button class="small" id="reset" type="button">Resetten</button>
    </div>
    <ul class="history" id="history"></ul>
  </aside>
</div>

<script>
(() => {
  const EXCLUDED = "douwe";
  const COLORS = ["#d6331f","#f2a516","#2f8f5b","#2867c6","#7c3fb8","#e0559a","#14a3a3","#e2702a","#5b7a1f","#3a4fb0"];
  const FAVORITE = "Team geeft appeltaart aan Douwe";
  const DEFAULT = ["Douwe","Sanne","Pieter",FAVORITE,"Lotte","Bram","Fleur","Jeroen","Eva"];

  const canvas = document.getElementById("wheel");
  const ctx = canvas.getContext("2d");
  const ta = document.getElementById("entries");
  const btn = document.getElementById("spin");
  const resultEl = document.getElementById("result");
  const countEl = document.getElementById("count");
  const historyEl = document.getElementById("history");

  let rotation = 0;
  let spinning = false;
  let items = [];

  try { const s = localStorage.getItem("rad-entries"); ta.value = s !== null ? s : DEFAULT.join("\n"); }
  catch { ta.value = DEFAULT.join("\n"); }
  const norm = (s) => s.trim().toLowerCase().replace(/\s+/g, " ");
  if (!ta.value.split("\n").some(s => norm(s) === norm(FAVORITE))) ta.value = ta.value.replace(/\s*$/, "") + "\n" + FAVORITE;

  const isExcluded = (name) => name.trim().toLowerCase() === EXCLUDED;

  // Geluid
  const soundBtn = document.getElementById("sound");
  let soundOn = true, actx = null;
  try { soundOn = localStorage.getItem("rad-sound") !== "off"; } catch {}
  function setSoundLabel() { soundBtn.textContent = "Geluid: " + (soundOn ? "aan" : "uit"); soundBtn.setAttribute("aria-pressed", soundOn); }
  setSoundLabel();
  soundBtn.addEventListener("click", () => { soundOn = !soundOn; setSoundLabel(); try { localStorage.setItem("rad-sound", soundOn ? "on" : "off"); } catch {} });
  function audio() {
    if (!actx) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null; actx = new AC(); }
    if (actx.state === "suspended") actx.resume();
    return actx;
  }
  function tone(freq, start, len, type = "sine", vol = 0.2) {
    const a = audio(); if (!a || !soundOn) return;
    const t = a.currentTime + start, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + len);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t + len + 0.02);
  }
  const tick = () => tone(1400 + Math.random() * 200, 0, 0.04, "square", 0.06);
  const whoosh = () => { tone(220, 0, 0.25, "triangle", 0.12); tone(330, 0.05, 0.25, "triangle", 0.1); };
  const fanfare = () => [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.12, i === 3 ? 0.6 : 0.18, "triangle", 0.22));

  // Achtergrondmuziek: vrolijk loopje van C - Am - F - G
  const musicBtn = document.getElementById("music");
  let musicOn = false, musicGain = null, musicTimer = null, nextTime = 0, step = 0;
  const BPM = 116, STEP = 60 / BPM / 2;
  const CHORDS = [[261.6, 329.6, 392.0], [220.0, 261.6, 329.6], [174.6, 220.0, 261.6], [196.0, 246.9, 293.7]];
  const PATTERN = [0, 1, 2, 1, 0, 2, 1, 2];
  function note(freq, t, len, type, vol) {
    const a = actx, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t + len);
    o.connect(g).connect(musicGain); o.start(t); o.stop(t + len + 0.02);
  }
  function schedule() {
    while (nextTime < actx.currentTime + 0.2) {
      const chord = CHORDS[Math.floor(step / 8) % 4], i = step % 8;
      note(chord[PATTERN[i]] * 2, nextTime, STEP * 0.9, "triangle", 0.25);
      if (i % 4 === 0) note(chord[0] / 2, nextTime, STEP * 3.5, "sine", 0.5);
      if (i % 2 === 1) note(6000, nextTime, 0.03, "square", 0.03);
      nextTime += STEP; step++;
    }
  }
  function startMusic() {
    const a = audio(); if (!a) return;
    musicGain = a.createGain(); musicGain.gain.value = 0.12; musicGain.connect(a.destination);
    nextTime = a.currentTime + 0.05; step = 0;
    schedule(); musicTimer = setInterval(schedule, 50);
  }
  function stopMusic() {
    clearInterval(musicTimer); musicTimer = null;
    if (musicGain) { const g = musicGain; g.gain.setTargetAtTime(0, actx.currentTime, 0.1); setTimeout(() => g.disconnect(), 600); musicGain = null; }
  }
  musicBtn.addEventListener("click", () => {
    musicOn = !musicOn;
    musicBtn.textContent = "Muziek: " + (musicOn ? "aan" : "uit");
    musicBtn.setAttribute("aria-pressed", musicOn);
    musicOn ? startMusic() : stopMusic();
  });

  function parse() {
    items = ta.value.split("\n").map(s => s.trim()).filter(Boolean);
    countEl.textContent = items.length + (items.length === 1 ? " vak" : " vakken");
    btn.disabled = spinning || !items.some(n => !isExcluded(n));
    try { localStorage.setItem("rad-entries", ta.value); } catch {}
    draw();
  }

  function css(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

  function draw() {
    const dpr = window.devicePixelRatio || 1;
    const size = canvas.clientWidth;
    if (canvas.width !== Math.round(size * dpr)) { canvas.width = canvas.height = Math.round(size * dpr); }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const c = size / 2, r = c - 6;
    ctx.clearRect(0, 0, size, size);

    const list = items.length ? items : ["Voeg vakken toe"];
    const n = list.length, seg = (Math.PI * 2) / n;
    const fontSize = Math.max(11, Math.min(22, size / 22, (seg * r) / 2.4));

    for (let i = 0; i < n; i++) {
      const a0 = rotation + i * seg - Math.PI / 2;
      ctx.beginPath(); ctx.moveTo(c, c); ctx.arc(c, c, r, a0, a0 + seg); ctx.closePath();
      let col = COLORS[i % COLORS.length];
      if (n > 1 && i === n - 1 && i % COLORS.length === 0) col = COLORS[1];
      ctx.fillStyle = items.length ? col : css("--line");
      ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,.55)"; ctx.lineWidth = 2; ctx.stroke();

      ctx.save();
      ctx.translate(c, c); ctx.rotate(a0 + seg / 2);
      ctx.fillStyle = "#fff"; ctx.textAlign = "right"; ctx.textBaseline = "middle";
      ctx.font = `600 ${fontSize}px Figtree, system-ui, sans-serif`;
      let label = list[i]; const maxW = r * 0.68;
      while (ctx.measureText(label).width > maxW && label.length > 1) label = label.slice(0, -2) + "…";
      ctx.shadowColor = "rgba(0,0,0,.35)"; ctx.shadowBlur = 3;
      ctx.fillText(label, r - 16, 0);
      ctx.restore();
    }
    ctx.beginPath(); ctx.arc(c, c, r, 0, Math.PI * 2); ctx.lineWidth = 6; ctx.strokeStyle = css("--hub"); ctx.stroke();
    ctx.beginPath(); ctx.arc(c, c, r * 0.09, 0, Math.PI * 2); ctx.fillStyle = css("--hub"); ctx.fill();
  }

  function spin() {
    if (spinning) return;
    const allowed = items.map((n, i) => i).filter(i => !isExcluded(items[i]));
    if (!allowed.length) return;

    const fav = allowed.filter(i => norm(items[i]) === norm(FAVORITE));
    const rest = allowed.filter(i => norm(items[i]) !== norm(FAVORITE));
    const pool = armed && fav.length ? fav : rest;
    if (!pool.length) return;
    armed = false;
    const target = pool[Math.floor(Math.random() * pool.length)];
    const n = items.length, seg = (Math.PI * 2) / n, TAU = Math.PI * 2;
    const f = 0.15 + Math.random() * 0.7;
    const desired = ((TAU - (target + f) * seg) % TAU + TAU) % TAU;
    const current = ((rotation % TAU) + TAU) % TAU;
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const turns = reduce ? 1 : 5 + Math.floor(Math.random() * 3);
    const delta = ((desired - current) + TAU) % TAU + TAU * turns;
    const start = rotation, dur = reduce ? 600 : 5200 + Math.random() * 1200;
    const t0 = performance.now();

    spinning = true; btn.disabled = true; ta.disabled = true; resultEl.textContent = "";
    audio(); whoosh();
    const segAt = rot => Math.floor((((-rot) % TAU + TAU) % TAU) / seg);
    let lastSeg = segAt(rotation);
    const ease = t => 1 - Math.pow(1 - t, 4);
    function frame(now) {
      const t = Math.min(1, (now - t0) / dur);
      rotation = start + delta * ease(t);
      draw();
      const s = segAt(rotation);
      if (s !== lastSeg) { lastSeg = s; tick(); }
      if (t < 1) return requestAnimationFrame(frame);
      spinning = false; ta.disabled = false;
      const winner = items[target];
      fanfare();
      resultEl.innerHTML = "";
      resultEl.append("Het rad kiest ", Object.assign(document.createElement("b"), { textContent: winner }));
      const li = document.createElement("li"); li.textContent = winner;
      historyEl.prepend(li);
      while (historyEl.children.length > 12) historyEl.lastChild.remove();
      parse();
    }
    requestAnimationFrame(frame);
  }

  document.getElementById("shuffle").addEventListener("click", () => {
    if (spinning) return;
    const a = ta.value.split("\n").map(s => s.trim()).filter(Boolean);
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    ta.value = a.join("\n"); parse();
  });
  let armed = false;
  document.getElementById("reset").addEventListener("click", () => { historyEl.innerHTML = ""; resultEl.textContent = ""; armed = true; });
  ta.addEventListener("input", parse);
  btn.addEventListener("click", spin);
  window.addEventListener("resize", draw);
  matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", draw);
  new MutationObserver(draw).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  if (document.fonts) document.fonts.ready.then(draw);
  parse();
})();
</script>

</html>
